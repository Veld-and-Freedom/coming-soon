<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veld and Freedom — Coming Soon</title>
<meta name="description" content="Veld and Freedom. Our store is coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --olive: #4A4A2A;
    --gold: #B8860B;
    --brown: #2C1810;
    --linen: #F5F0E8;
    --terracotta: #C4704A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--linen);
    color: var(--brown);
    font-family: 'Lato', sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
    min-height: 100vh;
  }
  main { max-width: 34rem; width: 100%; }
  .logo { width: min(380px, 80vw); height: auto; display: block; margin: 0 auto 1.75rem; }
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    color: var(--olive);
    letter-spacing: 0.04em;
    line-height: 1.1;
    margin-bottom: 0.5rem;
  }
  .rule { width: 3rem; height: 1px; background: var(--gold); margin: 0.75rem auto 2.25rem; border: 0; }
  .soon {
    text-transform: uppercase;
    letter-spacing: 0.3em;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--olive);
    margin-bottom: 1rem;
  }
  p.note { font-size: 1rem; line-height: 1.7; color: var(--brown); opacity: 0.85; }
  a { color: var(--terracotta); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .2s; }
  a:hover, a:focus { border-bottom-color: var(--terracotta); }
  footer { margin-top: 3.5rem; font-size: 0.75rem; letter-spacing: 0.08em; color: var(--olive); opacity: 0.7; }
</style>
</head>
<body>
<main>
  <!-- If logo.svg is missing, the text wordmark below shows instead -->
  <img class="logo" src="logo.svg" alt="Veld and Freedom"
       onerror="this.remove(); document.getElementById('wm').hidden = false;">
  <h1 class="wordmark" id="wm" hidden>Veld and Freedom</h1>

  <hr class="rule">

  <div class="soon">Coming soon</div>
  <p class="note">
    We're putting the finishing touches on our store.<br>
    For enquiries, write to us at
    <a href="mailto:admin@veldandfreedom.com">admin@veldandfreedom.com</a>.
  </p>
</main>
<footer>&copy; <span id="yr">2026</span> Veld and Freedom</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
